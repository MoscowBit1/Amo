<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amo ela</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 40%, rgba(255, 105, 180, .16), transparent 30%),
      radial-gradient(circle at 20% 80%, rgba(160, 100, 255, .12), transparent 28%),
      #09070d;
    color: #fff;
    font-family: Inter, sans-serif;
  }

  .stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.5px);
    background-size: 90px 90px, 140px 140px;
    background-position: 10px 20px, 50px 80px;
    opacity: .35;
  }

  .glow {
    position: fixed;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: rgba(255, 80, 170, .09);
    filter: blur(70px);
    animation: breathe 5s ease-in-out infinite;
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(90%, 720px);
    padding: 75px 35px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 36px;
    background: rgba(255,255,255,.045);
    backdrop-filter: blur(18px);
    box-shadow:
      0 30px 100px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.08);
    animation: appear 1.5s ease both;
  }

  .tiny {
    margin: 0 0 18px;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: .5;
  }

  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(68px, 16vw, 150px);
    line-height: .85;
    font-weight: 500;
    letter-spacing: -3px;
    text-shadow: 0 0 35px rgba(255, 170, 220, .25);
  }

  .heart {
    display: inline-block;
    margin-top: 32px;
    font-size: 20px;
    opacity: .75;
    animation: heartbeat 2s ease-in-out infinite;
  }

  .floating-heart {
    position: fixed;
    bottom: -30px;
    z-index: 1;
    color: rgba(255, 150, 205, .65);
    font-size: 18px;
    pointer-events: none;
    animation: float 9s linear infinite;
  }

  .h1 { left: 12%; animation-delay: 0s; }
  .h2 { left: 28%; animation-delay: 3s; font-size: 13px; }
  .h3 { left: 48%; animation-delay: 6s; }
  .h4 { left: 70%; animation-delay: 1.5s; font-size: 14px; }
  .h5 { left: 88%; animation-delay: 4.5s; }

  @keyframes appear {
    from { opacity: 0; transform: translateY(18px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(.9); opacity: .7; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    12% { opacity: .7; }
    100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  @media (max-width: 500px) {
    .card { padding: 65px 20px; border-radius: 28px; }
    .tiny { letter-spacing: 3px; }
    h1 { letter-spacing: -2px; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="glow"></div>

<div class="floating-heart h1">♡</div>
<div class="floating-heart h2">♡</div>
<div class="floating-heart h3">♡</div>
<div class="floating-heart h4">♡</div>
<div class="floating-heart h5">♡</div>

<main class="card">
  <p class="tiny">uma pequena verdade</p>
  <h1>amo ela</h1>
  <div class="heart">♡</div>
</main>

</body>
</html>
